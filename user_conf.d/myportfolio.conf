map $request_method $timeline_post_limit_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $timeline_post_limit_key zone=timeline_post_per_ip:10m rate=1r/m;

server {
    listen 80;
    server_name bgar324-portfolio.165-227-22-205.sslip.io;

    if ($host = bgar324-portfolio.165-227-22-205.sslip.io) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bgar324-portfolio.165-227-22-205.sslip.io;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/timeline_post {
        limit_req zone=timeline_post_per_ip;
        limit_req_status 429;

        proxy_pass http://myportfolio:5000;
    }

    location / {
        proxy_pass http://myportfolio:5000/;
    }

    ssl_certificate /etc/letsencrypt/live/myportfolio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myportfolio/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myportfolio/chain.pem;
}
