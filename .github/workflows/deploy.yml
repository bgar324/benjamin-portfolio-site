name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      TESTING: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Set up Python virtual environment
        run: python -m venv python3-virtualenv

      - name: Install dependencies
        run: python3-virtualenv/bin/pip install -r requirements.txt

      - name: Run tests
        run: ./run_test.sh

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          ssh-keyscan -H "$SSH_IP" 2>/dev/null >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host my-vps' \
            "  HostName $SSH_IP" \
            "  User $SSH_USER" \
            '  IdentityFile ~/.ssh/deploy-key' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy site
        run: ssh my-vps '~/redeploy-site.sh'

      - name: Print container status
        run: ssh my-vps 'cd ${{ secrets.PROJECT_ROOT }} && docker compose -f docker-compose.prod.yml ps'

      - name: Notify Discord of successful deployment
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"content":"🚀 Deployment Successful"}' \
            "$DISCORD_WEBHOOK"

  notify-failure:
    name: Notify Discord of deployment failure
    needs:
      - test
      - deploy
    if: ${{ always() && (needs.test.result != 'success' || needs.deploy.result != 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Send failure notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"content":"🚨 Deployment Failed"}' \
            "$DISCORD_WEBHOOK"
